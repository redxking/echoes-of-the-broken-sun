; stays the single ground-position channel: roughly a dozen command sites read
; HitResult.Location from it as a battlefield ground point, so nothing drawn
; above the ground may block it. This trace-type channel carries entity
; resolution instead, defaults to Ignore, and is blocked only by the presentation
; components that stand for an entity the player can see.
